{% extends "base.html" %}
{% set titulo_pagina = "Dar Baixa" %}
{% block conteudo %}

<form method="post" id="form-baixa">

  <div class="ornament" style="margin:8px 0 16px;">· · ·</div>

  <div style="margin-bottom:14px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:6px; font-size:16px;">
      🔍 BUSCAR MATERIAL (nome ou GTIN)
    </label>
    <div style="display:flex; gap:8px;">
      <input id="busca-material" placeholder="Digite o nome ou escaneie o GTIN..." class="input-vintage" style="font-size:17px !important; flex:1;" autocomplete="off">
      <button type="button" class="btn-scan" onclick="abrirScanner('busca-material', () => document.getElementById('busca-material').dispatchEvent(new Event('input')))">
        📷 Escanear
      </button>
    </div>
  </div>

  <div style="margin-bottom:20px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:8px; font-size:16px;">
      📦 QUAL MATERIAL FOI USADO? <span style="color:var(--danger);">*</span>
    </label>
    <select name="material_id" id="sel-mat" onchange="atualizarInfo()" required class="input-vintage" style="font-size:17px !important; font-family:'Crimson Text',serif;">
      <option value="">— Escolha um material —</option>
      {% for m in materiais %}
      <option value="{{ m.id }}" data-qtd="{{ m.quantidade }}" data-unid="{{ m.unidade }}"
              data-nome="{{ m.nome|lower }}" data-gtin="{{ (m.gtin or '')|lower }}"
              {% if m.id == mid_preselecionado %}selected{% endif %}>
        {{ m.emoji }} {{ m.nome }}{% if m.gtin %} · GTIN {{ m.gtin }}{% endif %}  ·  {{ m.quantidade }} {{ m.unidade }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div id="info-box" style="display:none; background:var(--accent-lt); border:1.5px solid var(--accent);
       border-radius:12px; padding:14px 16px; margin-bottom:20px; text-align:center;">
    <p class="font-crimson" style="color:var(--primary); font-size:17px; font-style:italic; margin:0 0 4px 0;">Estoque atual disponível</p>
    <p class="font-serif" style="font-size:32px; font-weight:700; color:var(--primary); line-height:1.2; margin:0;">
      <span id="qtd-atual">—</span>
      <span id="unid-atual" style="font-size:20px; font-weight:600;"></span>
    </p>
  </div>

  <div style="margin-bottom:20px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:8px; font-size:16px;">
      📏 QUANTO FOI USADO? <span style="color:var(--danger);">*</span>
    </label>
    <input name="quantidade" type="number" min="1" step="1" placeholder="0" required class="input-vintage" id="inp-qtd" style="text-align:center; font-size:36px !important; font-weight:800; color:var(--primary); height:80px;">
    <p class="font-crimson" style="text-align:center; color:var(--muted); font-style:italic; margin-top:6px; font-size:16px;" id="label-unid"> </p>
  </div>

  <div style="margin-bottom:24px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:10px; font-size:16px;">
      💬 MOTIVO DA BAIXA
    </label>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      {% for motivo in motivos %}
      <label style="display:flex; align-items:center; gap:8px; background:var(--card);
                    border:2px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer;" class="motivo-label">
        <input type="radio" name="motivo" value="{{ motivo }}" onchange="highlightMotivo()" {% if loop.first %}checked{% endif %} style="accent-color:var(--primary); width:18px; height:18px;">
        <span class="font-crimson" style="font-size:16px; color:var(--text); font-weight:600;">{{ motivo }}</span>
      </label>
      {% endfor %}
      <label style="display:flex; align-items:center; gap:8px; background:var(--card);
                    border:2px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer;" class="motivo-label" id="lbl-motivo-outro">
        <input type="radio" name="motivo" value="Outro" onchange="highlightMotivo()" style="accent-color:var(--primary); width:18px; height:18px;">
        <span class="font-crimson" style="font-size:16px; color:var(--text); font-weight:600;">🔹 Outro</span>
      </label>
    </div>
    <div id="custom-motivo-box" style="display:none; margin-top:12px;">
      <input name="motivo_custom" id="motivo_custom" placeholder="Descreva o motivo da saída..." class="input-vintage" style="font-size:17px !important;">
    </div>
  </div>

  <div class="ornament" style="margin-bottom:20px;">· · ·</div>

  <button type="submit" class="btn-primary" style="font-size:18px !important; padding:16px;">
    ✂️ Confirmar Baixa
  </button>

</form>

{% endblock %}

{% block scripts %}
<script>
  const selMat = document.getElementById('sel-mat');
  const busca  = document.getElementById('busca-material');
  const inpQtd = document.getElementById('inp-qtd');

  function isUnidadeInteira(unid) {
    const u = (unid || '').toLowerCase().trim();
    return u === 'unidades' || u === 'unidade' || u === 'unid' || u === 'pares' || u === 'pacotes';
  }

  function atualizarInfo() {
    const opt = selMat.selectedOptions[0];
    const box = document.getElementById('info-box');
    
    if (opt && opt.value) {
      document.getElementById('qtd-atual').textContent = opt.dataset.qtd;
      document.getElementById('unid-atual').textContent = opt.dataset.unid;
      document.getElementById('label-unid').textContent = 'Unidade: ' + opt.dataset.unid;
      box.style.display = 'block';

      const inteira = isUnidadeInteira(opt.dataset.unid);
      if (inteira) {
        inpQtd.step = '1';
        inpQtd.min = '1';
        inpQtd.inputMode = 'numeric';
        // Se houver número com casas decimais, remove
        if (inpQtd.value && inpQtd.value.includes('.')) {
          inpQtd.value = Math.max(1, Math.round(parseFloat(inpQtd.value)));
        }
      } else {
        inpQtd.step = '0.01';
        inpQtd.min = '0.01';
        inpQtd.inputMode = 'decimal';
      }
    } else {
      box.style.display = 'none';
      document.getElementById('label-unid').textContent = '';
    }
  }

  // Previne caracteres decimais para unidades inteiras
  inpQtd.addEventListener('keydown', (e) => {
    const opt = selMat.selectedOptions[0];
    if (opt && opt.value && isUnidadeInteira(opt.dataset.unid)) {
      if (e.key === '.' || e.key === ',' || e.key === 'e' || e.key === 'E' || e.key === '+' || e.key === '-') {
        e.preventDefault();
      }
    }
  });

  inpQtd.addEventListener('input', () => {
    const opt = selMat.selectedOptions[0];
    if (opt && opt.value && isUnidadeInteira(opt.dataset.unid)) {
      // Remove pontos ou vírgulas colados
      if (inpQtd.value.includes('.') || inpQtd.value.includes(',')) {
        inpQtd.value = inpQtd.value.replace(/[^0-9]/g, '');
      }
    }
  });

  // Filtra as opções do <select> por nome OU código GTIN
  busca.addEventListener('input', () => {
    const termo = busca.value.trim().toLowerCase();
    let primeiraVisivel = null;
    Array.from(selMat.options).forEach(opt => {
      if (!opt.value) { opt.hidden = false; return; }
      const bate = !termo || opt.dataset.nome.includes(termo) || opt.dataset.gtin.includes(termo);
      opt.hidden = !bate;
      if (bate && !primeiraVisivel) primeiraVisivel = opt;
    });
    // Se sobrou apenas 1 opção compatível, seleciona automaticamente
    const visiveis = Array.from(selMat.options).filter(o => o.value && !o.hidden);
    if (termo && visiveis.length === 1) {
      selMat.value = visiveis[0].value;
      atualizarInfo();
    }
  });

  function highlightMotivo() {
    let selectedVal = '';
    document.querySelectorAll('.motivo-label').forEach(el => {
      const inp = el.querySelector('input[type=radio]');
      el.style.borderColor = inp.checked ? 'var(--primary)' : 'var(--border)';
      el.style.background  = inp.checked ? 'var(--accent-lt)' : 'var(--card)';
      if (inp.checked) selectedVal = inp.value;
    });
    const customBox = document.getElementById('custom-motivo-box');
    const customInp = document.getElementById('motivo_custom');
    if (selectedVal === 'Outro') {
      customBox.style.display = 'block';
      customInp.focus();
    } else {
      customBox.style.display = 'none';
      customInp.value = '';
    }
  }

  atualizarInfo();
  highlightMotivo();
</script>
{% endblock %}
