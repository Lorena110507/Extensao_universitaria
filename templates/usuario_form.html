{% extends "base.html" %}
{% set titulo_pagina = "Criar Usuário" %}
{% block conteudo %}

<h3 class="font-serif">Criar novo usuário</h3>
<form method="post" style="margin-top:12px; max-width:420px;">
  <div style="margin-bottom:12px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:6px;">Nome de usuário</label>
    <input name="username" required class="input-vintage" placeholder="Digite um nome de acesso">
  </div>
  <div style="margin-bottom:12px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:6px;">Senha</label>
    <input name="password" type="password" required class="input-vintage" placeholder="Senha segura">
  </div>
  <div style="margin-bottom:12px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:6px;">Confirme a senha</label>
    <input name="password2" type="password" required class="input-vintage" placeholder="Repita a senha">
  </div>
  <div style="margin-bottom:12px;">
    <label style="display:block; font-weight:700; color:var(--primary); margin-bottom:6px;">Área / Papel</label>
    <select name="role" class="input-vintage">
      <option value="Admin">Admin (acesso total)</option>
      <option value="Financeiro">Financeiro</option>
      <option value="Estoque">Estoque</option>
      <option value="Producao">Produção</option>
      <option value="Vendas">Vendas</option>
      <option value="Relatorios">Relatórios</option>
      <option value="">Nenhum/Limitado</option>
    </select>
  </div>
  <button type="submit" class="btn-primary">✅ Criar usuário</button>
</form>

{% endblock %}
