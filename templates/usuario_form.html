{% extends "base.html" %}
{% set titulo_pagina = "Novo Usuário" %}
{% set subtitulo = "Cadastro de Acesso" %}
{% block conteudo %}

<div style="margin-bottom:18px;">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <div>
      <h3 class="font-serif" style="font-size:22px; color:var(--primary); margin:0;">➕ Criar Novo Usuário</h3>
      <p class="font-crimson" style="font-size:13px; color:var(--muted); margin:2px 0 0 0; font-style:italic;">
        Cadastre login, senha e selecione o papel de acesso do colaborador
      </p>
    </div>
    <a href="{{ url_for('usuarios') }}" class="btn-ghost" style="padding:6px 12px; font-size:13px; min-height:34px;">
      ← Voltar aos Usuários
    </a>
  </div>
</div>

<div class="card" style="padding:20px; max-width:480px;">
  <form method="post">
    <div style="margin-bottom:14px;">
      <label style="display:block; font-weight:700; color:var(--primary); font-size:13px; margin-bottom:4px;">
        Nome de Usuário (Login) <span style="color:var(--danger);">*</span>
      </label>
      <input name="username" required class="input-vintage" placeholder="Ex: maria.silva">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block; font-weight:700; color:var(--primary); font-size:13px; margin-bottom:4px;">
        Senha de Acesso <span style="color:var(--danger);">*</span>
      </label>
      <input name="password" type="password" required class="input-vintage" placeholder="Digite uma senha">
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block; font-weight:700; color:var(--primary); font-size:13px; margin-bottom:4px;">
        Confirme a Senha <span style="color:var(--danger);">*</span>
      </label>
      <input name="password2" type="password" required class="input-vintage" placeholder="Repita a senha digitada">
    </div>

    <div style="margin-bottom:20px;">
      <label style="display:block; font-weight:700; color:var(--primary); font-size:13px; margin-bottom:4px;">
        Papel / Nível de Acesso <span style="color:var(--danger);">*</span>
      </label>
      <select name="role" class="input-vintage" required>
        <option value="">-- Selecione o Papel --</option>
        {% for p in papeis %}
          <option value="{{ p.name }}">
            {{ p.name }}{% if p.name == 'Admin' %} (Acesso Total a Todas as Abas){% elif p.description %} — {{ p.description }}{% endif %}
          </option>
        {% endfor %}
      </select>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button type="submit" class="btn-primary" style="width:auto; min-width:180px;">
        ✅ Criar Usuário
      </button>
      <a href="{{ url_for('usuarios') }}" class="btn-ghost" style="width:auto; padding:12px 18px;">
        Cancelar
      </a>
    </div>
  </form>
</div>

{% endblock %}
